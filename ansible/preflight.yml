---
- name: Validate the selected workload account and Region
  hosts: localhost
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars_files: [settings.yml]
  vars:
    diskmon_inventory_settings: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/inventory.aws_ec2.yml') | from_yaml }}"
  tasks:
    - name: Validate runtime configuration and thresholds
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.19', '>=')
          - ansible_version.full is version('2.20', '<')
          - groups.get('linux', []) | length > 0
          - workload_account_id is string
          - workload_account_id is match('^[0-9]{12}$')
          - diskmon_runtime_role_arn is match('^arn:aws:iam::' ~ workload_account_id ~ ':role/[A-Za-z0-9_+=,.@/-]+$')
          - ansible_aws_ssm_profile | length > 0
          - ansible_aws_ssm_bucket_name != 'replace-me'
          - ansible_aws_ssm_bucket_name is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
          - ansible_aws_ssm_document == 'AWS-StartInteractiveCommand'
          - diskmon_inventory_settings.profile == ansible_aws_ssm_profile
          - diskmon_inventory_settings.regions == [aws_region]
          - diskmon_metric_namespace == 'Enterprise/DiskMonitoring'
          - diskmon_warning_threshold | float >= 0
          - diskmon_warning_threshold | float < diskmon_critical_threshold | float
          - diskmon_critical_threshold | float <= 100
        fail_msg: Configure the workload role, account, bucket, thresholds and matching inventory profile/Region.

    - name: Refuse merged or inconsistent host identities
      ansible.builtin.assert:
        that:
          - hostvars[diskmon_host].instance_id | default('') is match('^i-([0-9a-f]{8}|[0-9a-f]{17})$')
          - diskmon_host == hostvars[diskmon_host].instance_id
          - hostvars[diskmon_host].ansible_host == hostvars[diskmon_host].instance_id
          - hostvars[diskmon_host].placement.region == aws_region
          - hostvars[diskmon_host].state.name == 'running'
          - hostvars[diskmon_host].platform | default('') != 'windows'
        fail_msg: Use the supplied running-instance inventory for one account and Region.
      loop: "{{ groups['linux'] }}"
      loop_control:
        loop_var: diskmon_host

    - name: Verify the runtime profile identity before AWS changes
      ansible.builtin.command:
        argv: [aws, sts, get-caller-identity, --profile, "{{ ansible_aws_ssm_profile }}", --region, "{{ aws_region }}", --output, json, --no-cli-pager]
      register: diskmon_identity
      changed_when: false
      when: not ansible_check_mode

    - name: Refuse another account or runtime role
      ansible.builtin.assert:
        that:
          - (diskmon_identity.stdout | from_json).Account == workload_account_id
          - (diskmon_identity.stdout | from_json).Arn is match('^arn:aws:sts::' ~ workload_account_id ~ ':assumed-role/' ~ (diskmon_runtime_role_arn.split('/')[-1] | regex_escape) ~ '/')
        fail_msg: The named profile must assume the declared workload runtime role.
      when: not ansible_check_mode